<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Here We Go AI Chat</title>
</head>

<body>

<h2>Here We Go! Unit 1</h2>

<input id="msg" type="text">
<button onclick="send()">Send</button>

<div id="chat"></div>

<script>

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbztoogQOCgrZ3VYFum8QW1J-MYqzZlmYU2n_htDQ_vRORmeCRfjM8orsPiL3BBXB71H1g/exec";

async function send(){

const msg =
document.getElementById("msg").value;

const res =
await fetch(
WEBAPP_URL,
{
method:"POST",
body:JSON.stringify({
message:msg
})
}
);

const data =
await res.json();

document.getElementById("chat").innerHTML +=
"<p><b>You:</b> "
+ msg +
"</p><p><b>AI:</b> "
+ data.reply +
"</p>";

document.getElementById("msg").value="";
}

</script>

</body>
</html>
